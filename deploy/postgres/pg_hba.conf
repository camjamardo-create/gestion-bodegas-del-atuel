# Reglas de autenticacion del PostgreSQL de referencia.
# Solo se aceptan conexiones TCP cifradas. El socket local queda disponible
# para las tareas de inicializacion y mantenimiento dentro del contenedor.
#
# En un proveedor gestionado, esta politica se reemplaza por la allowlist de
# red/VPC del proveedor y por sslmode=require (o verify-full con su CA).

local   all             all                                     trust
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
hostnossl all           all             all                     reject
