services:
  postgres:
    image: postgres:18
    container_name: bodegas_del_atuel_etapa3
    environment:
      POSTGRES_DB: bodegas_del_atuel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Definir APP_DB_PASSWORD en .env}
      APP_REPORT_PASSWORD: ${APP_REPORT_PASSWORD:?Definir APP_REPORT_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bodegas_pgdata:/var/lib/postgresql
      - ./db/migrations:/migrations:ro
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      default:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bodegas_del_atuel"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  api:
    build:
      context: ./api
    container_name: bodegas_del_atuel_api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bodegas_del_atuel
      DB_USER: rol_api
      DB_PASSWORD: ${APP_DB_PASSWORD:?Definir APP_DB_PASSWORD en .env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  front:
    build:
      context: ./front
    container_name: bodegas_del_atuel_front
    environment:
      # /api funciona con el proxy interno de nginx. Para un front separado
      # de la API, usar una URL absoluta, por ejemplo https://api.example.com.
      API_BASE_URL: ${API_BASE_URL:-/api}
    ports:
      - "${FRONT_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bodegas_pgdata:
